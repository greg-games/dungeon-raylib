name: Build WebAssembly

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-web:
    name: Build for Web (Emscripten)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.58
          actions-cache-folder: 'emsdk-cache'

      # KROK 1: Pobieramy kod źródłowy Raylib bezpośrednio w powłoce systemowej
      - name: Clone Raylib Source
        run: |
          git clone --depth 1 --branch 5.5 https://github.com /home/runner/work/raylib-src

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      # KROK 2: Przekazujemy ścieżkę do pobranego Raylib jako zmienną do CMake
      - name: Configure CMake with Emscripten
        run: |
          rm -rf build-web
          emcmake cmake -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWEB_RAYLIB_SRC=/home/runner/work/raylib-src

      - name: Build with Ninja
        run: |
          cmake --build build-web -j $(nproc)


      - name: Verify build output
        run: |
          ls -la build-web

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build-web
