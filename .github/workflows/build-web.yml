name: Build WebAssembly

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-web:
    name: Build for Web (Emscripten)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository (Game)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Raylib Repository
        uses: actions/checkout@v4
        with:
          repository: 'raysan5/raylib'
          ref: '5.5'
          path: 'raylib-src' 
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure CMake with Emscripten
        run: |
          rm -rf build-web
          emcmake cmake -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWEB_RAYLIB_SRC="${{ github.workspace }}/raylib-src"

      - name: Build with Ninja
        run: |
          cmake --build build-web -j $(nproc)

      - name: Verify build output
        run: |
          ls -la build-web

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build-web
